[project]
name = "ha-for-korea"
version = "1.4.1"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["custom_components/kepco_on"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "^class .*\\(Protocol\\):$",
  "^if TYPE_CHECKING:$",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["custom_components", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PT",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "B904",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["custom_components/kepco_on", "tests"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "aresponses.*",
  "pytest_homeassistant_custom_component.*",
]
ignore_missing_imports = true
